# AstrCode LLM 配置示例
# 
# 本文件展示了如何配置不同的 LLM 提供商
# 复制此文件并根据需要修改，然后重命名为 config.yaml

# ============================================
# 选项 1: OpenAI (包括兼容 OpenAI API 的服务)
# ============================================
# 适用于: OpenAI, Azure OpenAI, Ollama, LocalAI, LM Studio, vLLM 等

llm:
  provider: "openai"
  
  # OpenAI 官方 API
  base_url: "https://api.openai.com"
  api_key: "sk-your-openai-api-key"
  model: "gpt-4o"
  
  # 或者使用 Azure OpenAI
  # base_url: "https://your-resource.openai.azure.com"
  # api_key: "your-azure-api-key"
  # model: "gpt-4"
  
  # 或者使用 Ollama (本地部署)
  # base_url: "http://localhost:11434"
  # api_key: ""  # Ollama 不需要 API Key
  # model: "qwen2.5"
  
  # 或者使用 LM Studio (本地部署)
  # base_url: "http://localhost:1234/v1"
  # api_key: "lm-studio"  # LM Studio 需要任意字符串作为 API Key
  # model: "local-model"
  
  temperature: 0.7
  max_tokens: 2000
  timeout: 60s


# ============================================
# 选项 2: Google Gemini
# ============================================
# 适用于: Google Gemini API

# llm:
