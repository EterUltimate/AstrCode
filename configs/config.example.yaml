#   
#   temperature: 0.7
#   max_tokens: 2000
#   timeout: 60s


# ============================================
# 其他配置
# ============================================

server:
  addr: ":8080"
  read_timeout: 30s
  write_timeout: 30s

astrbot:
  base_url: "http://localhost:6185"
  token: ""
  max_retries: 3
  timeout: 30s

skills:
  directory: "./skills"
  top_k: 5
  embedding_model: ""

cache:
  skill_ttl: 10m
  plan_ttl: 30m
  embedding_ttl: 1h

log:
  level: "info"
  format: "json"
