# AstrCode 配置文件

server:
  addr: ":8080"
  read_timeout: 30s
  write_timeout: 30s

astrbot:
  base_url: "http://localhost:6185"
  token: ""
  max_retries: 3
  timeout: 30s

llm:
  # LLM 提供商类型: openai, gemini, claude
  provider: "openai"
  
  # API 基础 URL (根据不同提供商配置)
  # OpenAI: https://api.openai.com (或自定义如 http://localhost:11434)
  # Gemini: https://generativelanguage.googleapis.com/v1beta
  # Claude: https://api.anthropic.com
  base_url: "https://api.openai.com"
  
  # API Key
  api_key: ""
  
  # 模型名称
  # OpenAI: gpt-4o, gpt-4-turbo, gpt-3.5-turbo
  # Gemini: gemini-2.0-flash, gemini-1.5-pro
  # Claude: claude-3-5-sonnet-20241022, claude-3-opus-20240229
  model: "gpt-4o"
  
  temperature: 0.7
  max_tokens: 2000
  timeout: 60s

skills:
  directory: "./skills"
  top_k: 5
  embedding_model: ""

cache:
  skill_ttl: 10m
  plan_ttl: 30m
  embedding_ttl: 1h

log:
  level: "info"
  format: "json"
