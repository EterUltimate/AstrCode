name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.21'

jobs:
  # ============================================================
  # Job 1: Lint + Vet + Format
  # ============================================================
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "❌ Files not formatted:"
            echo "$output"
            exit 1
          fi
          echo "✅ All files formatted"

      - name: Go vet
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ============================================================
  # Job 2: Unit Tests
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage report generated" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job 3: Build (multi-platform)
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY=astrcode
          if [ "$GOOS" = "windows" ]; then
            BINARY=astrcode.exe
          fi
          go build -ldflags="-s -w -X main.version=0.4.0 -X main.commit=${{ github.sha }}" -o dist/${BINARY} cmd/server/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrcode-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ============================================================
  # Job 4: Docker Build
  # ============================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: astrcode:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 5: Integration Test (smoke)
  # ============================================================
  integration:
    name: Integration Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download linux binary
        uses: actions/download-artifact@v4
        with:
          name: astrcode-linux-amd64
          path: dist/

      - name: Smoke test
        run: |
          chmod +x dist/astrcode
          # Start server in background
          ./dist/astrcode -addr :8080 &
          SERVER_PID=$!
          sleep 3

          # Health check
          HEALTH=$(curl -sf http://localhost:8080/health || echo "FAILED")
          echo "Health: $HEALTH"

          # Kill server
          kill $SERVER_PID 2>/dev/null || true

          # Verify health response contains "ok"
          echo "$HEALTH" | grep -q '"ok"' && echo "✅ Smoke test passed" || echo "⚠️ Smoke test incomplete (no AstrBot backend expected in CI)"
